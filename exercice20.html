<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web20</title>
    <style>
        .cross{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            .triangle{
                top: 0;
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
                border-top: 150px solid transparent;
                border-bottom: 150px solid darkslategray;
                border-right: 150px solid transparent;
                border-left: 150px solid transparent;
            }
            
            .rect{
                position: relative;
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: darkslategray;
                height: 200px;
                width: 80px;
            }
        }
    </style>
</head>
<body>

    <div class="cross">
        <div class="triangle"></div>
        <div class="rect"></div>
    </div>
    
</body>
</html>
