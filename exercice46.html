<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web46</title>
    <style>
        .container{
            margin: 140px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 200px;
            border-radius: 12px;
            background-color: #2C3E50;
            gap: 5px;

            .cir1, .cir2, .cir3 {
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 50px;
                height: 50px;
                border-radius: 100%;
            }
            .cir1{
                background-color: #E74C3C;
            }
            .cir2{
                background-color: #F1C40F;
            }
            .cir3{
                background-color:#2ECC71 ;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="cir1"></div>
        <div class="cir2"></div>
        <div class="cir3"></div>
    </div>
</body>
</html>
