<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web63</title>
    <style>
        .flag{
            position: absolute;
            align-items: center;
            justify-content: center;
            width: 300px;
            height: 200px;

            .black{
                position: relative;
                display: flex;
                width: 100%;
                height: 30%;
                background-color: black;

            }


            .red{
                position: relative;
                display: flex;
                width: 100%;
                height: 30%;
                background-color: red;

            }

            .yellow{
                position: relative;
                display: flex;
                width: 100%;
                height: 30%;
                background-color: yellow;

            }
        }
    </style>
</head>
<body>
    <div class="flag">
        <div class="black"></div>
        <div class="red"></div>
        <div class="yellow"></div>
    </div>
</body>
</html>
