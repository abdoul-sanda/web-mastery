<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web49</title>
    <style>
        .container {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            width: 100vw;
            height: 100vh;

            .circle {
                z-index: 1000;
                position: relative;
                display: flex;
                align-self: center;
                justify-content: center;
                border: 3px solid transparent;
                width: 90px;
                height: 90px;
                background-color: #F1C40F;
                border-radius: 100%;
            }

            .ligne1 {
                position: absolute;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 2px;
                height: 220px;
                background-color: #F1C40F;
                transform: rotate(30deg);
            }

            .ligne2 {
                position: absolute;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 2px;
                height: 220px;
                background-color: #F1C40F;
                transform: rotate(-30deg);

            }

            .ligne3 {
                position: absolute;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 2px;
                height: 220px;
                background-color: #F1C40F;
                transform: rotate(90deg);

            }

            .ligne4 {
                position: absolute;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 2px;
                height: 220px;
                background-color: #F1C40F;
                transform: rotate(-90deg);

            }

            .ligne5 {
                position: absolute;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 2px;
                height: 220px;
                background-color: #F1C40F;

            }

            .ligne6 {
                position: absolute;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 2px;
                height: 220px;
                background-color: #F1C40F;
                transform: rotate(-60deg);

            }

            .ligne7 {
                position: absolute;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 2px;
                height: 220px;
                background-color: #F1C40F;
                transform: rotate(60deg);

            }


        }
    </style>
</head>

<body>
    <div class="container">
        <div class="circle"></div>
        <div class="ligne1"></div>
        <div class="ligne2"></div>
        <div class="ligne3"></div>
        <div class="ligne4"></div>
        <div class="ligne5"></div>
        <div class="ligne6"></div>
        <div class="ligne7"></div>
    </div>
</body>

</html>
