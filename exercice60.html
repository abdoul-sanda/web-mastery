<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web60</title>
    <style>

        body{
            margin: 3px;
            padding: 0;
            gap: 10px;
            box-sizing: border-box;
        }
        .top {
            display: flex;
            position: relative;
            top: 0;
            width: 100vw;
            height: 200px;
            background-color: #2C3E50;
        }



        .container {
            display: flex;
            flex-direction: row;


            .left {
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 20vw;
                background-color: #95A5A6;
            }

            .center {
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 60vw;
                background-color: #ECF0F1;
            }

            .right {
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                width: 20vw;
                background-color: #95A5A6;
            }
        }

        .bottom {
            display: flex;
            position: relative;
            bottom: 0;
            width: 100vw;
            height: 200px;
            background-color: #2C3E50;
        }
    </style>
</head>

<body>
    <div class="top"></div>
    <div class="container">
        <div class="left"></div>
        <div class="center"></div>
        <div class="right"></div>
    </div>
    <div class="bottom"></div>
</body>

</html>
