<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web43</title>
    <style>
        .container1{
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 200px auto;
            border: 40px solid #F5CBA7;
            width: 120px;
            height: 120px;

            .container2{
                position: absolute;
                display: flex;
                align-items: center;
                justify-content: center;
                border: 10px solid red;
                width: 110px;
                height: 110px;
                background-color: #AED6F1;

                .content{
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    background-color: #3498DB;
                    height: 60px;
                    width: 60px;
                }
            }
        }
    </style>
</head>
<body>
    <div class="container1">
        <div class="container2">
            <div class="content"></div>
        </div>
    </div>
</body>
</html>
