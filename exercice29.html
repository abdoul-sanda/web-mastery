<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web29</title>
    <style>
        .water{
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            width: 100vw;
            height: 100vh;

            .circle{
                position: absolute;
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: rgb(122, 145, 238);
                margin: 100px auto;
                width: 120px;
                height: 120px;
                border-radius: 50%;

            }
            
            .triangle{
                top: 23%;
                position: absolute;
                display: flex;
                align-items: center;
                justify-content: center;
                border: 60px solid transparent;
                border-left: 120px solid rgb(122, 145, 238);
                transform: rotate(-90deg);
            }
        }
    </style>
</head>
<body>
    <div class="water">
        <div class="triangle"></div>
        <div class="circle"></div>
    </div>
    
</body>
</html>
