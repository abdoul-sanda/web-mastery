<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web18</title>
    <style>
        .cross {
            display: flex;
            justify-content: center;
            align-items: center;

            .first {
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 80px;
                height: 400px;
                background-color: skyblue;
                border: none;
            }

            .second {
                position: absolute;
                display: flex;
                align-items: center;
                justify-content: center;
                height: 80px;
                width: 400px;
                background-color: skyblue;
                border: none;
            }
        }
    </style>
</head>

<body>

    <div class="cross">
        <div class="first"></div>
        <div class="second"></div>
    </div>

</body>

</html>
