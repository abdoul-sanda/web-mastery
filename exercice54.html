<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web54</title>
    <style>
       .container{
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px auto;


        .rect-a{
            position: absolute;
            top: 40%;
            width: 65px;
            height: 200px;
            border: 3px solid #2C3E50;
            border-top: none;
            border-bottom: none;
        }

        .rect-b{
            position: absolute;
            top: 50%;
            height: 65px;
            width: 200px;
            border: 3px solid #2C3E50;
            border-left: none;
            border-right: none;
        }
       }
    </style>
</head>
<body>
    <div class="container">
        <div class="rect-a"></div>
        <div class="rect-b"></div>
    </div>
</body>
</html>
