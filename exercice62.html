<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web63</title>
    <style>
        .flag{
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 200px solid;
            height: 200px;
            width: 300px;
            border: 2px solid;
            gap: 1%;


            .green{
                position: relative;
                display: flex;
                height: 100%;
                width: 33%;
                background-color: green;
            }

            .white{
                position: relative;
                display: flex;
                height: 100%;
                width: 33%;
                background-color: white;
            }

            .red{
                position: relative;
                display: flex;
                height: 100%;
                width: 33%;
                background-color: red;
            }
        }
    </style>
</head>
<body>
    <div class="flag">
        <div class="green"></div>
        <div class="white"></div>
        <div class="red"></div>
    </div>
</body>
</html>
