<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web61</title>
    <style>
        .flag{
            position: absolute;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            margin: 200px auto;
            width: 300px;
            height: 200px;
            border: 2px solid;

            .blue{
                position: relative;
                display: flex;
                height: 100%;
                width: 33vw;
                background-color: rgb(79, 79, 201);

            }
            .white{
                display: flex;
                height: 100%;
                width: 33vw;

            }

            .red{
                display: flex;
                height: 100%;
                width: 33vw;
                background-color: red;
            }
        }
    </style>
</head>
<body>
    <div class="flag">
        <div class="blue"></div>
        <div class="white"></div>
        <div class="red"></div>
    </div>
</body>
</html>
