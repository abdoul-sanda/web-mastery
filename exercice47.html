<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web47</title>
    <style>
        .container {
            display: flex;
            position: absolute;
            top: 50%;
            left: 50%;

            .circle {
                display: flex;
                align-items: center;
                justify-content: center;
                margin: auto;
                border: 8px solid #E74C3C;
                width: 80px;
                height: 80px;
                border-radius: 100%;

                .circle2 {
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    margin: auto;
                    border: 8px solid #E74C3C;
                    width: 40px;
                    height: 40px;
                    border-radius: 100%;
                }

                .main {
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    margin: auto;
                    background-color:  #E74C3C;
                    width: 20px;
                    height: 20px;
                    border-radius: 100%;
                }
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="circle">
            <div class="circle2">
                <div class="main"></div>
            </div>
        </div>
    </div>
</body>

</html>
