<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web53</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            height: 50px;
            width: 200px;

            .first {
                border: 1px solid;
                background-color: #F39C12;
            }

            .second {
                border: 1px solid;
                background-color: #E74C3C;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="first"></div>
        <div class="second"></div>
        <div class="first"></div>
        <div class="second"></div>
    </div>
    <div class="container">
        <div class="second"></div>
        <div class="first"></div>
        <div class="second"></div>
        <div class="first"></div>
    </div>
    <div class="container">
        <div class="first"></div>
        <div class="second"></div>
        <div class="first"></div>
        <div class="second"></div>
    </div>
    <div class="container">
        <div class="second"></div>
        <div class="first"></div>
        <div class="second"></div>
        <div class="first"></div>
    </div>
</body>

</html>
