<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web64</title>
    <style>
        .flag{
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 300px;
            height: 200px;

            .first{
                position: relative;
                width: 50%;
                height: 100%;
                background-color: green;
            }

            .second{
                position: relative;
                flex-direction: column;
                width: 50%;
                height: 100%;
                
                .yellow{
                    position: relative;
                    height: 50%;
                    width: 100%;
                    background-color: yellow;
                }

                .red{
                    position: relative;
                    height: 50%;
                    width: 100%;
                    background-color: red;
                }
            }
        }
    </style>
</head>
<body>
    <div class="flag">
        <div class="first"></div>
        <div class="second">
            <div class="yellow"></div>
            <div class="red"></div>
        </div>
    </div>
</body>
</html>
