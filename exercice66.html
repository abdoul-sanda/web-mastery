<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web68</title>
    <style>
        .flag{
            position: absolute;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            width: 50%;
            height: 40%;
            border: 2px solid;

            .first{
                position: relative;
                top: 10px;
                left: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 30%;
                height: 40px;
                background-color: #0392eb;
                transform: rotate(-30deg);
            }

        }
    </style>
</head>
<body>
    <div class="flag">
    <div class="first"></div>
    <div class="second"></div>
    <div class="third"></div>
    </div>
</body>
</html>
