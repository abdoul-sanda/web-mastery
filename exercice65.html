<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web65</title>
    <style>
        .flag{
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 300px;
            height: 200px;

            .vert{
                display: flex;
                height: 100%;
                width: 30%;
                background-color: green;

            }

            .jaune{
                display: flex;
                height: 100%;
                width: 30%;
                background-color: yellow;
                
            }

            .rouge{
                display: flex;
                height: 100%;
                width: 30%;
                background-color: red;
                
            }

        }
    </style>
</head>
<body>
    <div class="flag">
        <div class="vert"></div>
        <div class="jaune"></div>
        <div class="rouge"></div>
    </div>
</body>
</html>
